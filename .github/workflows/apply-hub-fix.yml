name: Apply Main Hub Fix
on:
  push:
    branches: [main]
    paths:
      - 'mobile-hub-fix.js'
      - '.github/workflows/apply-hub-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile fix script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./mobile-hub-fix.js?v=1" defer></script>'
          if tag not in s:
              s = s.replace('</head>', tag + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile game layout and admin visibility'
          git push
