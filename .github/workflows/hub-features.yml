name: Wire Hub Features
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire feature modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="./hub-features.js" defer></script>','<script src="./hub-override.js"></script>']
          marker='</head>'
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Main Hub feature overrides"
          git push
